# Ensure Plymouth animation plays for at least ~9s (56 frames @ 6.25fps + fade).
# Plymouth starts at ~T+3s, so we wait until uptime >= 12s before allowing quit.
# If boot is already slow enough, this adds zero delay.
[Service]
ExecStartPre=/bin/sh -c 'up=$$(cut -d. -f1 /proc/uptime); r=$$((12 - up)); [ "$$r" -gt 0 ] && sleep "$$r" || true'
