[Service]
# Bound the wait for network-online.target.
#
# systemd-networkd-wait-online runs --any with no timeout. On the DBC the only
# networkd-managed interface is usb0, and usb0 exists only while the USB link
# to the MDB is up. With that link down the unit waits forever, so
# network-online.target never activates and multi-user.target never starts:
# no dropbear (no SSH even once the link returns), no version-service, and no
# update-service, which means a pending mender update can never be committed.
#
# The failure is badly disguised. scootui-qt and pppd are DefaultDependencies=no
# so they come up regardless: the board paints a dashboard and answers over the
# PPP backup link while every other service is missing.
#
# A degraded or absent inter-board link should slow the boot down, never stop
# it. Nothing under multi-user has any business being gated on the link to the
# other board.
#
# SuccessExitStatus=0 1 so hitting the timeout is not a unit failure — the
# point is to proceed, not to report a problem.
#
# The MDB does not have this exposure today: 30-end0.network sets
# RequiredForOnline=no and 10-usb0.network sets ConfigureWithoutCarrier=yes, so
# networkd can reach online there with no peer attached. The bound is installed
# on both boards anyway, because that protection is two lines in two .network
# files and this costs nothing.
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=15
SuccessExitStatus=0 1
