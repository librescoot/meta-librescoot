# Drop-in for systemd-journal-upload.service.
#
# Scooter journald is volatile (no /var/log/journal/ → Storage=auto falls
# through to /run/log/journal/ on tmpfs), so cross-reboot persistence of
# the upload cursor points at entries that no longer exist anywhere.
# Keep the cursor in tmpfs so we still survive intra-boot service
# restarts without wearing out the eMMC.
[Service]
StateDirectory=
RuntimeDirectory=systemd/journal-upload
BindPaths=/run/systemd/journal-upload:/var/lib/systemd/journal-upload
