# Librescoot journald settings, installed as
# /etc/systemd/journald.conf.d/10-librescoot.conf
#
# This is a drop-in and not /etc/systemd/journald.conf because the systemd-conf
# package ships /usr/lib/systemd/journald.conf.d/00-systemd-conf.conf, and any
# drop-in outranks the main configuration file regardless of which directory it
# sits in. Settings placed in journald.conf therefore lose on every key that
# 00-systemd-conf.conf also sets (ForwardToSyslog, RuntimeMaxUse).
#
# Drop-ins are sorted by filename across all of /etc, /run and /usr/lib, and the
# lexicographically last file wins. 10- beats 00- because of the number, not
# because of the directory. Leaves 60-90 free for a local admin override, per
# systemd's own recommendation.
#
# RuntimeMaxUse must stay at 64M or above. The journal is volatile unless
# /data/settings/journald-persistent exists, so SystemMaxUse governs nothing on
# a default system and the runtime cap is what actually decides how much history
# a scooter keeps. Drop this key and journald falls back to 10% of /run, roughly
# 10M on the 98M tmpfs, cutting retention by about a factor of six.
[Journal]
ForwardToSyslog=no
SystemMaxUse=200M
RuntimeMaxUse=64M
