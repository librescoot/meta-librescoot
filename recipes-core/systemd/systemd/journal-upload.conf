[Upload]
# TODO: set via 'scooter.logserver' in settings (HSET settings scooter.logserver URL).
# Once scooter.logserver is set, settings-service rewrites this entire file.
URL=https://logs.example.com:19532

# ServerKeyFile=- + ServerCertificateFile=- disable client-cert auth so
# journal-upload doesn't look for the compiled-in default
# /etc/ssl/{private,certs}/journal-upload.pem pair (which doesn't exist on
# the scooter). Both must be set together or journal-upload refuses to
# start with "Options --key= and --cert= must be used together."
ServerKeyFile=-
ServerCertificateFile=-

# TrustedCertificateFile=- disables server-cert verification so https:// URLs
# with self-signed or unknown-CA certs work without a CA bundle.
TrustedCertificateFile=-
