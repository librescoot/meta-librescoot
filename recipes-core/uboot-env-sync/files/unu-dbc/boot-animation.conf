set-if-missing boot_animation librescoot
set-if-missing boot_sound 1

# bootargs carries both parameters. U-Boot expands ${boot_animation} when it
# reads the variable, so the stored text keeps the reference literal.
#
# The controlled string below is the bootstrap for a board whose saved env
# still holds nothing but a bare console. Everything after it is token-level:
# an exact whole-string match cannot express a value containing spaces, so it
# never migrated a real Mender line.
set-if-matches bootargs console=ttymxc0,115200 console=ttymxc0,115200 loglevel=0 quiet systemd.show_status=false vt.global_cursor_default=0 boot.animation=${boot_animation}
append-if-missing bootargs boot.animation=${boot_animation}
append-if-missing bootargs logo.name=${boot_animation}

set-always splashpos m,395
