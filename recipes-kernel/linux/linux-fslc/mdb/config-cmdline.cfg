# rng_core.default_quality=1024: credit CAAM hwrng output as full-entropy
# so the kernel CRNG initializes in <1s instead of ~12s.
# systemd-random-seed.service blocks on CRNG init before sysinit.target.
# The CAAM RNG4 is a hardware DRBG (NIST SP800-90B) — crediting its output
# as 1 bit/bit is the same trust assumption as RANDOM_TRUST_CPU on x86.
CONFIG_CMDLINE="quiet loglevel=5 rng_core.default_quality=1024"
CONFIG_CMDLINE_EXTEND=y
