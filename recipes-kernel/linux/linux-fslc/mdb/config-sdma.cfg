# imx-pwm-led writes its own SDMA script to data word 0xc00, which is program
# halfword 6144, exactly where sdma-imx6q.bin's ram_code_start_addr points.
# Built-in makes the firmware request fail at ~0.9s, long before the module
# loads, so the script keeps the address. As a module the two would race.
CONFIG_IMX_SDMA=y
