# The MDB is headless: no display, audio, camera or touch input. Drop the
# EVK-oriented driver payload that imx_v6_v7_defconfig carries. Disabled
# built-ins shrink the zImage and the resident kernel; disabled =m entries
# shrink the module set that kernel-modules installs on the rootfs.
#
# Cross-checked against lsmod on a running MDB (2026-07): nothing disabled
# here is loaded there, except evbug which is dropped deliberately (see
# below). g_ether (g-ether-conf), g_mass_storage (loaded on demand by
# ums-service), brcmfmac/mwifiex (machine wifi) and the SIM7100E stack
# (option/qmi_wwan/cdc-wdm) are untouched.

# imx_v6_v7_defconfig never enables the following explicitly - they were
# held on purely by select-chains from the graphics/sound/media stack
# disabled below, so they must be re-asserted here. Losing TMPFS makes
# systemd unbootable (/run), losing I2C takes the LP5562 LEDs, PN544 NFC
# readers and BMX055 IMU along, and the rest were active on shipped
# kernels (imx_thermal, CMA pool, cpufreq). Verified by diffing merged
# .configs with and without this fragment.
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y
CONFIG_I2C=y
CONFIG_REGULATOR=y
CONFIG_THERMAL=y
CONFIG_IMX_THERMAL=y
CONFIG_ARM_IMX6Q_CPUFREQ=y
CONFIG_CMA=y
CONFIG_DMA_CMA=y
CONFIG_KCMP=y

# Display / graphics
# CONFIG_DRM is not set
# CONFIG_FB is not set
# CONFIG_BACKLIGHT_CLASS_DEVICE is not set
# CONFIG_LOGO is not set

# Audio (host side and USB gadget)
# CONFIG_SOUND is not set
# CONFIG_USB_AUDIO is not set

# Cameras / video capture / CODA VPU
# CONFIG_MEDIA_SUPPORT is not set

# Touch input, incl. the i.MX6UL on-chip touch controller
# CONFIG_INPUT_TOUCHSCREEN is not set

# WLAN vendors not present on this board (BCM4339/43455 and NXP 8987 stay)
# CONFIG_ATH10K is not set
# CONFIG_ATH10K_SDIO is not set
# CONFIG_WL12XX is not set
# CONFIG_WL18XX is not set
# CONFIG_WLCORE is not set
# CONFIG_WLCORE_SDIO is not set

# Classic-BT PAN networking; the BLE/GATT stack does not use it
# CONFIG_BT_BNEP is not set

# EVK leftovers with no counterpart in the MDB devicetree
# CONFIG_QCA7000_SPI is not set
# CONFIG_USB_PEGASUS is not set
# CONFIG_USB_RTL8150 is not set
# CONFIG_USB_NET_CDC_EEM is not set
# CONFIG_MOUSE_PS2 is not set
# CONFIG_SERIO_SERPORT is not set
# CONFIG_INPUT_GPIO_BEEPER is not set
# CONFIG_I2C_ALGOPCF is not set
# CONFIG_I2C_ALGOPCA is not set
# CONFIG_SIOX is not set
# CONFIG_SIOX_BUS_GPIO is not set
# CONFIG_GPIO_SIOX is not set
# CONFIG_W1 is not set
# CONFIG_RN5T618_POWER is not set
# CONFIG_SENSORS_LM75 is not set
# CONFIG_DA9063_WATCHDOG is not set
# CONFIG_IIO_ST_ACCEL_3AXIS is not set

# Input-event debug logger: its only function is copying every input event
# (button presses) into dmesg. Loaded on current images, but as debug
# leftover; dropped deliberately.
# CONFIG_INPUT_EVBUG is not set

# Test and benchmark modules
# CONFIG_USB_TEST is not set
# CONFIG_USB_EHSET_TEST_FIXTURE is not set
# CONFIG_DMATEST is not set

# Unused USB gadget configs (g_ether and g_mass_storage stay enabled)
# CONFIG_USB_ZERO is not set
# CONFIG_USB_G_NCM is not set
# CONFIG_USB_GADGETFS is not set
# CONFIG_USB_FUNCTIONFS is not set
# CONFIG_USB_G_SERIAL is not set

# Unused filesystems; vfat with cp437/iso8859-1 codepages is built in
# CONFIG_ISO9660_FS is not set
# CONFIG_UDF_FS is not set
# CONFIG_MSDOS_FS is not set
# CONFIG_NLS_ISO8859_15 is not set
