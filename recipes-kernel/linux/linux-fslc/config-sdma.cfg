# Built-in rather than a module: no board ships the external ram script, and the
# ROM firmware serves every channel both boards use (UART, SPI, SSI). What the
# ram script would add is a program image at data word 0xc00 — program halfword
# 6144, sdma-imx6q.bin's ram_code_start_addr.
#
# DBC: the 2.5 Mbaud UART link to the MDB needs RX DMA. UART3's CTS/RTS pads are
# muxed to flexcan1, so the link is 2-wire; a PIO receiver overruns the 32-byte
# FIFO under load and drops PPP frames, and imx-uart falls back to PIO silently
# when no SDMA driver is bound.
#
# MDB: 0xc00 is the slot imx-pwm-led writes its own script into
# (unu,sdma-script-origin) for the EPIT-driven LED channels. The driver
# re-requests the ram script on the suspend/resume path with the rootfs up, so
# shipping it would overwrite that script. Nothing else needs it, so neither
# image installs it.
CONFIG_IMX_SDMA=y
