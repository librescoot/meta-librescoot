# Built-in, not a module, because both boards need the SDMA engine before the
# rootfs is up:
#
# MDB: imx-pwm-led writes its own SDMA script to data word 0xc00, which is
# program halfword 6144, exactly where sdma-imx6q.bin's ram_code_start_addr
# points. Built-in makes the firmware request fail at ~0.9s, long before the
# module loads, so the driver keeps the ROM firmware and the script keeps the
# address. As a module the two would race.
#
# DBC: the 2.5 Mbaud UART link to the MDB needs RX DMA. UART3's CTS/RTS pads are
# muxed to flexcan1, so the link is 2-wire; a PIO receiver overruns the 32-byte
# FIFO under load and drops PPP frames. With no SDMA driver bound, imx-uart
# falls back to PIO silently and the link loses ~1 frame in 60.
CONFIG_IMX_SDMA=y
