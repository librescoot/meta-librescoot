# ---------------------------------------------------------------------------
# DBC boot-time kernel strip
#
# Removes subsystems and drivers not present on the DBC instrument cluster
# (i.MX6DL, SPI LCD, eMMC, USB gadget Ethernet, PPP over UART, CAN, I2C).
# Applied as the last config fragment so it overrides everything.
# ---------------------------------------------------------------------------

# -- Kernel compression: LZ4 decompresses ~2x faster than gzip on ARM ------
# CONFIG_KERNEL_GZIP is not set
CONFIG_KERNEL_LZ4=y

# -- Optimise for size: smaller kernel = less cache pressure on Cortex-A9 ---
# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set
CONFIG_CC_OPTIMIZE_FOR_SIZE=y

# -- Sound/ALSA: no audio hardware on DBC ----------------------------------
# (eliminates fsl-ssi-dai probing 4x during boot)
# CONFIG_SOUND is not set

# -- Bluetooth: not used on DBC --------------------------------------------
# CONFIG_BT is not set

# -- WiFi/Wireless: no WiFi hardware ---------------------------------------
# (eliminates cfg80211 X.509 cert loading during boot)
# CONFIG_CFG80211 is not set
# CONFIG_MAC80211 is not set
# CONFIG_WLAN is not set
# CONFIG_RFKILL is not set

# -- Media/Camera/V4L2/DVB: no camera or video capture --------------------
# (eliminates /dev/video0-4 registration during boot)
# CONFIG_MEDIA_SUPPORT is not set
# CONFIG_RC_CORE is not set
# CONFIG_CEC_CORE is not set

# -- SCSI/SATA: no SATA or SCSI disks -------------------------------------
# CONFIG_SCSI is not set
# CONFIG_ATA is not set

# -- PCI/PCIe: not used on DBC board --------------------------------------
# CONFIG_PCI is not set

# -- MTD/NAND/NOR: DBC uses eMMC, not flash -------------------------------
# CONFIG_MTD is not set

# -- NFS/RPC: instrument cluster doesn't need network filesystems ----------
# CONFIG_NFS_FS is not set
# CONFIG_SUNRPC is not set

