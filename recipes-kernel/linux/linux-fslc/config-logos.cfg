# logo.name=<name> selects an embedded alternative before fbcon draws.  The
# boot_animation U-Boot variable supplies the same name to the kernel and the
# userspace animation.  Each enabled slot needs a matching P3 PPM:
# logo/logo_alt<N>_clut224.ppm.  pnmtologo permits at most 224 colours.
#
# 480x480 CLUT224 logos cost about 225 KiB each in the kernel's initdata.
CONFIG_LOGO_ALT1_CLUT224=y
CONFIG_LOGO_ALT1_NAME="windowsxp"
CONFIG_LOGO_ALT2_CLUT224=y
CONFIG_LOGO_ALT2_NAME="librescoot-xp"
CONFIG_LOGO_ALT3_CLUT224=y
CONFIG_LOGO_ALT3_NAME="coopertino"
