# Credit CAAM hwrng output as full-entropy so the kernel CRNG initializes
# in <1s instead of ~12s. systemd-random-seed.service blocks on CRNG init
# before sysinit.target, so this shaves ~4s off the boot chain.
#
# Without this, the hwrng thread reads from rng-caam but quality=0 means
# 0 bits of entropy are credited via add_hwgenerator_randomness(), and the
# kernel waits for interrupt/disk entropy instead. The CAAM RNG4 is a
# hardware DRBG (NIST SP800-90B) — crediting its output as 1 bit/bit is
# the same trust assumption as RANDOM_TRUST_CPU on x86.
CONFIG_CMDLINE="quiet loglevel=5 rng_core.default_quality=1024"
