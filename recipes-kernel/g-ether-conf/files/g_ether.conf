# Derive stable, locally administered device and host MACs from machine-id.
install g_ether /bin/sh -c 'mid=$(cat /etc/machine-id); dev=02:$(printf %s "$mid" | cut -c1-10 | sed "s/../&:/g;s/:$//"); host=06:$(printf %s "$mid" | cut -c11-20 | sed "s/../&:/g;s/:$//"); /sbin/modprobe --ignore-install g_ether dev_addr=$dev host_addr=$host'
