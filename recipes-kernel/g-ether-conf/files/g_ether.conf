# Derive a stable MAC from the device's machine-id (OCOTP UID).
# Sets the locally-administered bit (02:) so it won't collide with
# globally assigned OUI addresses.
install g_ether /bin/sh -c 'mid=$(cat /etc/machine-id); mac=02:${mid:0:2}:${mid:2:2}:${mid:4:2}:${mid:6:2}:${mid:8:2}; /sbin/modprobe --ignore-install g_ether dev_addr=$mac'
