# Derive stable, locally administered device and host MACs from machine-id.
install g_ether /bin/sh -c 'mid=$(cat /etc/machine-id); dev=02:${mid:0:2}:${mid:2:2}:${mid:4:2}:${mid:6:2}:${mid:8:2}; host=06:${mid:10:2}:${mid:12:2}:${mid:14:2}:${mid:16:2}:${mid:18:2}; /sbin/modprobe --ignore-install g_ether dev_addr=$dev host_addr=$host'
