# LibreScoot DBC (Dashboard Controller Board) distribution configuration
#
# This distro targets the i.MX6DL-based DBC — the rider-facing dashboard
# with a display, GPU-accelerated Flutter UI, navigation, audio, and
# CarPlay support. Also used for the RPi4 development target.

DISTRO = "librescoot-dbc"
DISTRO_NAME = "LibreScoot DBC"
DISTRO_CODENAME ?= "none"
DISTRO_VERSION := "${LIBRESCOOT_VERSION}"

# -----------------------------------------------------------------------
# DISTRO_FEATURES — explicit list of what we actually need
# -----------------------------------------------------------------------
# NOTE: We intentionally do NOT include the NXP fsl-imx-base.inc fragment.
#
# systemd       — init system
# usrmerge      — merged /usr layout
# pam           — pluggable authentication
# ipv4 ipv6     — networking
# usbgadget     — USB device mode
# usbhost       — USB host support
# ext2          — ext4 rootfs support
# largefile     — large file support
# pci           — PCI bus support
# wayland       — Wayland display protocol (for Flutter/Weston)
# opengl        — GPU acceleration
# alsa          — audio support (for CarPlay, navigation prompts)
DISTRO_FEATURES = " \
    systemd usrmerge pam \
    ipv4 ipv6 \
    usbgadget usbhost \
    ext2 largefile pci \
    wayland opengl \
    alsa \
"

# -----------------------------------------------------------------------
# Init system — systemd
# -----------------------------------------------------------------------
INIT_MANAGER = "systemd"

# -----------------------------------------------------------------------
# NXP / Freescale BSP settings
# -----------------------------------------------------------------------
ACCEPT_FSL_EULA = "1"

# SOC family — needed by meta-freescale recipes
SOC_FAMILY_mx6dl = "mx6:mx6dl"

# -----------------------------------------------------------------------
# Mender OTA configuration (common settings)
# -----------------------------------------------------------------------
require conf/distro/include/mender-librescoot.inc

# -----------------------------------------------------------------------
# Timezone
# -----------------------------------------------------------------------
DEFAULT_TIMEZONE = "Europe/Berlin"

# -----------------------------------------------------------------------
# Conditional layer handling
# -----------------------------------------------------------------------
BBMASK:append = " ${@bb.utils.contains('BBFILE_COLLECTIONS', 'raspberrypi', '', 'recipes-kernel/linux/linux-raspberrypi_6.6.bbappend', d)}"
