include conf/distro/include/fsl-imx-base.inc
include conf/distro/include/fsl-imx-preferred-env.inc

DISTRO = "librescoot-dbc"

DISTRO_NAME = "Librescoot"
DISTRO_CODENAME ?= "none"

DISTRO_FEATURES:remove = "directfb x11 zeroconf avahi 3g nfc bluetooth opencl wifi ptest"
DISTRO_FEATURES:append = " opengl pam systemd usrmerge"

DISTRO_VERSION := "${LIBRESCOOT_VERSION}"

# Set default timezone to Europe/Berlin
DEFAULT_TIMEZONE = "Europe/Berlin"

BBMASK:append =  " ${@bb.utils.contains('BBFILE_COLLECTIONS', 'raspberrypi', '', 'recipes-kernel/linux/linux-raspberrypi_6.6.bbappend', d)}"

# host-user-contaminated fires because the build runs in a container as a fixed
# uid/gid (999): files produced by the builder and then packaged (e.g. cpio's
# ptest helpers) match the builder's gid. This is unavoidable with a fixed build
# user and is cosmetic for the final image (rootfs ownership is reset at image
# assembly), so downgrade it from a fatal QA error to a warning.
ERROR_QA:remove = "host-user-contaminated"
WARN_QA:append = " host-user-contaminated"

# DBC runs linux-fslc 6.12; oe-core OLDEST_KERNEL is 5.15, so glibc requires
# >= 5.15 userspace headers. meta-librescoot also ships linux-libc-headers 5.4.25
# (for the 5.4-kernel MDB), which gets selected here and fails glibc's
# "kernel header at least 5.15" check. Pin the modern oe-core headers for DBC.
PREFERRED_VERSION_linux-libc-headers = "6.18"

# Some upstreams (e.g. w1.fi/wpa_supplicant) re-roll same-version tarballs, breaking
# recorded checksums. Try the Yocto source mirror (which keeps the original) first.
INHERIT += "own-mirrors"
SOURCE_MIRROR_URL = "https://downloads.yoctoproject.org/mirror/sources/"
