# LibreScoot MDB (Main Driver Board) distribution configuration
#
# This distro targets the i.MX6UL-based MDB — a headless board that runs
# the core vehicle services, cellular connectivity, and CAN communication.
# No display, no GPU, no Wayland/X11.

DISTRO = "librescoot-mdb"
DISTRO_NAME = "LibreScoot MDB"
DISTRO_CODENAME ?= "none"
DISTRO_VERSION := "${LIBRESCOOT_VERSION}"

# -----------------------------------------------------------------------
# DISTRO_FEATURES — explicit list of what we actually need
# -----------------------------------------------------------------------
# NOTE: We intentionally do NOT include the NXP fsl-imx-base.inc fragment.
# That fragment pulls in a broad set of features (x11, wayland, etc.) and
# then we'd have to remove them. Instead we declare exactly what we need.
#
# systemd       — init system
# usrmerge      — merged /usr layout (Yocto default going forward)
# pam           — pluggable authentication (needed by systemd, dropbear)
# ipv4 ipv6     — networking
# usbgadget     — USB device mode (g_ether for debug network)
# usbhost       — USB host support
# ext2          — ext4 rootfs support
# largefile     — large file support
# pci           — PCI bus (required by some subsystems even on non-PCI SoCs)
# wifi          — Wi-Fi support (BCM4339/BCM43455 on MDB)
# bluetooth     — Bluetooth support
# 3g            — cellular modem support via ModemManager
DISTRO_FEATURES = " \
    systemd usrmerge pam \
    ipv4 ipv6 \
    usbgadget usbhost \
    ext2 largefile pci \
    wifi bluetooth 3g \
"

# -----------------------------------------------------------------------
# Init system — systemd
# -----------------------------------------------------------------------
INIT_MANAGER = "systemd"

# -----------------------------------------------------------------------
# NXP / Freescale BSP settings
# -----------------------------------------------------------------------
# These were previously inherited from fsl-imx-base.inc and
# fsl-imx-preferred-env.inc. We now set them explicitly.
#
# Accept the Freescale/NXP EULA (required for firmware blobs)
ACCEPT_FSL_EULA = "1"

# SOC family — needed by meta-freescale recipes
SOC_FAMILY_mx6ul = "mx6:mx6ul"

# -----------------------------------------------------------------------
# Preferred versions — override upstream meta-oe recipes with our
# custom-versioned copies for modem stack compatibility
# -----------------------------------------------------------------------
PREFERRED_VERSION_libmbim = "1.32.0"
PREFERRED_VERSION_libqmi = "1.36.0"
PREFERRED_VERSION_modemmanager = "1.24.0"

# Oldest kernel supported (for glibc/kernel-headers compatibility)
OLDEST_KERNEL = "5.4.24"

# -----------------------------------------------------------------------
# Mender OTA configuration (common settings)
# -----------------------------------------------------------------------
require conf/distro/include/mender-librescoot.inc

# -----------------------------------------------------------------------
# Timezone
# -----------------------------------------------------------------------
DEFAULT_TIMEZONE = "Europe/Berlin"

# -----------------------------------------------------------------------
# WireGuard kernel module autoload — this is a software/distro policy
# (not hardware-specific), so it belongs here rather than in machine conf.
# -----------------------------------------------------------------------
KERNEL_MODULE_AUTOLOAD:append = " wireguard"

# -----------------------------------------------------------------------
# Conditional layer handling
# -----------------------------------------------------------------------
# Mask the RPi kernel bbappend when meta-raspberrypi is not present
BBMASK:append = " ${@bb.utils.contains('BBFILE_COLLECTIONS', 'raspberrypi', '', 'recipes-kernel/linux/linux-raspberrypi_6.6.bbappend', d)}"

# MDB is headless — mask Qt recipes to skip their builds
BBMASK:append = " recipes-graphics/scootui-qt/"
BBMASK:append = " recipes-graphics/qmaplibre/"
BBMASK:append = " recipes-qt/"
