# meta-librescoot layer configuration
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
        ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "librescoot"
BBFILE_PATTERN_librescoot := "^${LAYERDIR}/"

# Priority 8: above most layers but not excessively high.
# This layer provides custom versions of modemmanager, libmbim, libqmi,
# linux-imx, u-boot-imx, linux-libc-headers, and python3-protobuf that
# must override upstream versions from meta-oe, meta-freescale, and poky.
# Priority 8 is sufficient to win over those layers (typically priority 5-6).
# NOTE: The original priority was 99 — likely set as a brute-force override.
BBFILE_PRIORITY_librescoot = "8"

# Layer dependencies
# core = poky/meta (OE-Core)
# freescale = meta-freescale (NXP BSP)
# openembedded-layer = meta-oe
# mender-core = meta-mender/meta-mender-core
# meta-flutter = meta-flutter
# meta-python = meta-openembedded/meta-python
# networking-layer = meta-openembedded/meta-networking
LAYERDEPENDS_librescoot = " \
    core \
    freescale-layer \
    openembedded-layer \
    meta-python \
    networking-layer \
    multimedia-layer \
    mender-core \
    flutter-layer \
"

LAYERSERIES_COMPAT_librescoot = "scarthgap"

# Use prebuilt Go binary instead of building from source (go-native uses Go 1.4
# bootstrap which can't build Go 1.25+)
PREFERRED_PROVIDER_go-native = "go-binary-native"

# Prefer Go 1.25.7 from this layer over Poky scarthgap's Go 1.22.2
PREFERRED_VERSION_go = "1.25.7"
PREFERRED_VERSION_go-binary-native = "1.25.7"
PREFERRED_VERSION_go-cross-${TUNE_PKGARCH} = "1.25.7"
PREFERRED_VERSION_go-crosssdk-${SDK_SYS} = "1.25.7"
PREFERRED_VERSION_go-cross-canadian-${TRANSLATED_TARGET_ARCH} = "1.25.7"
PREFERRED_VERSION_go-runtime = "1.25.7"
