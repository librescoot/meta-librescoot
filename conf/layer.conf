BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
        ${LAYERDIR}/recipes-*/*/*.bbappend"


BBFILE_PRIORITY_librescoot = "99"
BBFILE_COLLECTIONS += "librescoot"
BBFILE_PATTERN_librescoot := "^${LAYERDIR}/"
LAYERSERIES_COMPAT_librescoot = "scarthgap"

# Use prebuilt Go binary instead of building from source (go-native uses Go 1.4
# bootstrap which can't build Go 1.25+)
PREFERRED_PROVIDER_go-native = "go-binary-native"

# Prefer Go 1.25.7 from this layer over Poky scarthgap's Go 1.22.2
PREFERRED_VERSION_go = "1.25.7"
PREFERRED_VERSION_go-binary-native = "1.25.7"
PREFERRED_VERSION_go-cross-${TUNE_PKGARCH} = "1.25.7"
PREFERRED_VERSION_go-crosssdk-${SDK_SYS} = "1.25.7"
PREFERRED_VERSION_go-cross-canadian-${TRANSLATED_TARGET_ARCH} = "1.25.7"
PREFERRED_VERSION_go-runtime = "1.25.7"

