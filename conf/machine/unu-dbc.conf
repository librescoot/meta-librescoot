#@TYPE: Machine
#@NAME: LibreScoot DBC (Dashboard Controller Board)
#@SOC: NXP i.MX6DL (Dual Lite — dual Cortex-A9, 800 MHz + GPU)
#@DESCRIPTION: The DBC is the rider-facing dashboard in LibreScoot
#   electric scooters. It drives a touchscreen display (Flutter UI),
#   runs navigation (Valhalla/BRouter), CarPlay, and audio output.
#   Uses mainline BSP kernel (linux-fslc 6.6).
#   Storage: eMMC on /dev/mmcblk3.

MACHINEOVERRIDES =. "mx6:mx6dl:"
MACHINEOVERRIDES .= ":use-mainline-bsp"

require conf/machine/include/imx6sabresd-common.inc

# --- Hardware features ---
MACHINE_FEATURES = "usbgadget usbhost vfat"

# --- Kernel ---
KERNEL_DEVICETREE = " librescoot-dbc.dtb"
MACHINE_EXTRA_RRECOMMENDS = "kernel-modules"

# Hardware-specific kernel module:
#   opt3001 — ambient light sensor (TI OPT3001) for auto-brightness
KERNEL_MODULE_AUTOLOAD += "opt3001"

IMAGE_INSTALL:append = " kernel-devicetree kernel-image-zimage firmware-imx-epdc"

# --- Bootloader (U-Boot) ---
SPL_BINARY:pn-u-boot-imx = ""
UBOOT_MACHINE = "mx6solosabresd_config"
UBOOT_MAKE_TARGET = "all"
UBOOT_SUFFIX = "imx"

WKS_FILE = "sdimage-librescoot-dbc.wks"

# --- Firmware ---
MACHINE_FIRMWARE += "firmware-imx"
IMX_USE_LINUX_FIRMWARE_SDMA = "0"

# --- Mender OTA (machine-specific storage layout) ---
MENDER_STORAGE_DEVICE = "/dev/mmcblk3"
MENDER_UBOOT_STORAGE_DEVICE = "2"
MENDER_IMAGE_BOOTLOADER_FILE = "u-boot-dtb.imx"
MENDER_BOOT_PART = "/dev/mmcblk3p1"
MENDER_ROOTFS_PART_A = "/dev/mmcblk3p2"
MENDER_ROOTFS_PART_B = "/dev/mmcblk3p3"
MENDER_DATA_PART = "/dev/mmcblk3p4"
MENDER_BOOT_PART_SIZE_MB = "32"
MENDER_DATA_PART_SIZE_MB = "256"

MENDER_FEATURES_ENABLE:append = " mender-uboot mender-image-sd"
MENDER_FEATURES_DISABLE:append = " mender-grub mender-image-uefi"

IMAGE_FSTYPES:append = " sdimg.bmap"

# Set hostname from OCOTP hardware UID via U-Boot pre-setup hook.
# OCOTP_CFG1 shadow register (bank 0 word 2) at 0x021BC420 holds the upper
# 32-bit UID word, which encodes the per-die X/Y position. CFG0 collides
# across dies from the same wafer/lot, so we use CFG1 for uniqueness.
# setenv concatenates its args with spaces, so no inner quotes are needed
# even though bootargs contains spaces.
MENDER_UBOOT_PRE_SETUP_COMMANDS = "setexpr uid_hi *0x021BC420; setenv _hn systemd.hostname=unu-dbc-\${uid_hi}; setenv bootargs \${bootargs} \${_hn}"
