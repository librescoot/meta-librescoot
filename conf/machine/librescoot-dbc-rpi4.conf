#@TYPE: Machine
#@NAME: LibreScoot DBC on Raspberry Pi 4 (development target)
#@SOC: Broadcom BCM2711 (quad Cortex-A72, 64-bit)
#@DESCRIPTION: Development/testing target that runs the DBC software stack
#   on a Raspberry Pi 4 with a Waveshare DSI display. This allows
#   developers to work on the Flutter UI, navigation, and CarPlay
#   without needing actual scooter hardware.
#   Storage: microSD card.

MACHINEOVERRIDES =. "raspberrypi4:"

require conf/machine/include/arm/armv8a/tune-cortexa72.inc
include conf/machine/include/rpi-base.inc

# --- Hardware features ---
MACHINE_FEATURES += "pci"

# --- Wi-Fi / Bluetooth firmware ---
MACHINE_EXTRA_RRECOMMENDS += "\
    linux-firmware-rpidistro-bcm43455 \
    bluez-firmware-rpidistro-bcm4345c0-hcd \
    linux-firmware-rpidistro-bcm43456 \
    bluez-firmware-rpidistro-bcm4345c5-hcd \
"

# --- Kernel ---
RPI_KERNEL_DEVICETREE = " \
    broadcom/bcm2711-rpi-4-b.dtb \
    broadcom/bcm2711-rpi-400.dtb \
    broadcom/bcm2711-rpi-cm4.dtb \
    broadcom/bcm2711-rpi-cm4s.dtb \
"

SDIMG_KERNELIMAGE ?= "kernel8.img"
SERIAL_CONSOLES ?= "115200;ttyS0"
KBUILD_DEFCONFIG = "bcm2711_defconfig"

PREFERRED_PROVIDER_virtual/egl ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles2 ?= "mesa"
PREFERRED_PROVIDER_virtual/libgl ?= "mesa"

# 64-bit kernel — requires "Image" format and "booti" command
KERNEL_IMAGETYPE_UBOOT ?= "Image"
KERNEL_IMAGETYPE_DIRECT ?= "Image"
KERNEL_BOOTCMD ?= "booti"

# Hardware-specific kernel modules:
#   i2c-dev, i2c-bcm2708 — I2C bus access (for display, sensors)
KERNEL_MODULE_AUTOLOAD += "i2c-dev i2c-bcm2708"

IMAGE_INSTALL:append = " kernel-image kernel-devicetree"
IMAGE_INSTALL:append = " kernel-module-dwc2"
IMAGE_FSTYPES:remove = " rpi-sdimg"
IMAGE_FSTYPES:append = " sdimg.bmap"

# --- Bootloader (U-Boot on RPi4) ---
UBOOT_MACHINE = "rpi_arm64_config"
RPI_USE_U_BOOT = "1"
ENABLE_UART = "1"
ARMSTUB ?= "armstub8-gic.bin"
VC4DTBO ?= "vc4-kms-v3d"

# Suppress boot splash for faster boot
BOOT_DELAY = "0"
BOOT_DELAY_MS = "0"
DISABLE_SPLASH = "1"
DISABLE_RPI_BOOT_LOGO = "1"

# --- Peripherals ---
ENABLE_DWC2_HOST = "1"
ENABLE_I2C = "1"

# --- Display: Waveshare 7" DSI panel ---
RPI_KERNEL_DEVICETREE_OVERLAYS:append = " \
    overlays/vc4-kms-dsi-waveshare-panel.dtbo \
"
RPI_EXTRA_CONFIG:append = " \n\
# Enable waveshare panel \n\
dtoverlay=vc4-kms-dsi-waveshare-panel,7_0_inchC,i2c1 \n\
"

# --- Networking ---
CMDLINE_IFNAMES = "net.ifnames=1"

# --- Mender OTA (machine-specific storage layout) ---
MENDER_BOOT_PART_SIZE_MB = "100"
MENDER_STORAGE_TOTAL_SIZE_MB = "4000"
MENDER_DATA_PART_SIZE_MB = "256"
