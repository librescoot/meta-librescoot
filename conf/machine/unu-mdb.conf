#@TYPE: Machine
#@NAME: NXP i.MX6UL Evaluation Kit
#@SOC: i.MX6UL
#@DESCRIPTION: Machine configuration for NXP i.MX6UL EVK
#@MAINTAINER: Alexandru Palalau <ioan-alexandru.palalau@nxp.com>

MACHINEOVERRIDES =. "mx6ul:"
MACHINEOVERRIDES .= ":use-mainline-bsp"

include conf/machine/include/imx-base.inc
include conf/machine/include/arm/armv7a/tune-cortexa7.inc

MACHINE_FEATURES += "wifi bluetooth bcm4339 bcm43455 nxp8987-sdio"

KERNEL_DEVICETREE = " nxp/imx/librescoot-mdb.dtb"
### u-boot-imx settings ###

# The u-boot-imx does not provide SPL support
SPL_BINARY:pn-u-boot-imx = ""
UBOOT_MACHINE = "mx6ul_14x14_evk_config"
UBOOT_MAKE_TARGET = "all"
UBOOT_SUFFIX = "imx"

MACHINE_FIRMWARE += "firmware-imx-epdc"

KERNEL_MODULE_AUTOLOAD += "g_ether"
KERNEL_MODULE_AUTOLOAD += "wireguard"
KERNEL_MODULE_AUTOLOAD += "imx_pwm_led"

IMAGE_INSTALL:append = " kernel-devicetree kernel-image-zimage"
MACHINE_EXTRA_RRECOMMENDS = "kernel-modules"
MACHINE_FEATURES = "usbgadget usbhost vfat"

MENDER_STORAGE_DEVICE = "/dev/mmcblk1"

MENDER_DATA_PART_FSTYPE = "ext4"
MENDER_IMAGE_BOOTLOADER_FILE = "u-boot-dtb.imx"

MENDER_BOOT_PART_SIZE_MB = "32"
MENDER_DATA_PART_SIZE_MB = "256"
MENDER_STORAGE_TOTAL_SIZE_MB = "1344"

MENDER_FEATURES_ENABLE:append = " mender-uboot mender-image-sd"
MENDER_FEATURES_DISABLE:append = " mender-grub mender-image-uefi"

IMAGE_FSTYPES:append = " sdimg.bmap"

# imx-base.inc feeds this into IMAGE_FSTYPES with ?=, and sets it to
# "wic.bmap wic.gz" before including meta-imx's imx-base-extend.inc, which
# sets it again to "wic.bmap wic.zst tar.zst". Which one a machine ends up
# with is not obvious from either file, so empty the source rather than
# remove suffixes one at a time.
#
# What we flash and ship is the mender sdimg, built by do_image_sdimg from a
# kickstart mender generates itself. do_image_wic only ever produced artifacts
# nobody consumes.
SOC_DEFAULT_IMAGE_FSTYPES = ""

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "linux-imx-led"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-module-wireguard"

# Set hostname from OCOTP hardware UID via U-Boot pre-setup hook.
# OCOTP_CFG1 shadow register (bank 0 word 2) at 0x021BC420 holds the upper
# 32-bit UID word, which encodes the per-die X/Y position. CFG0 collides
# across dies from the same wafer/lot, so we use CFG1 for uniqueness.
# setenv concatenates its args with spaces, so no inner quotes are needed
# even though bootargs contains spaces.
MENDER_UBOOT_PRE_SETUP_COMMANDS = "setexpr uid_hi *0x021BC420; setenv _hn systemd.hostname=unu-mdb-\${uid_hi}; setenv bootargs \${bootargs} \${_hn}"
